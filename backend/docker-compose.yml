name: mail-reply-engine-backend

services:
  mail-reply-engine-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcg-mail-reply-engine-backend:latest
    container_name: mail-reply-engine-backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${BACKEND_PORT:-2101}
      ENVIRONMENT: ${DOCKER_ENVIRONMENT:-development}
      EVENT_DISPATCH_MODE: inline
      POSTGRES_DB_HOST: ${DOCKER_POSTGRES_HOST:-doe-postgres}
      POSTGRES_DB_PORT: ${DOCKER_POSTGRES_PORT:-5432}
      S3_ENDPOINT_URL: http://mail-reply-engine-minio:9000
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-2101}", "--workers", "1"]
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-2101}:${BACKEND_PORT:-2101}"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:${BACKEND_PORT:-2101}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mail-reply-engine-network
      - db-network
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  mail-reply-engine-network:
    name: ${APP_NETWORK:-${MINIO_NETWORK:-mail-reply-engine-network}}
    external: true
  db-network:
    name: ${DB_NETWORK:-doe-net}
    external: true
