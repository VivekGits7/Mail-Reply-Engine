[project]
name = "mail-reply-engine"
version = "2.0.0"
description = "HR email agent on Microsoft Graph with onboarding, exit, reminder, feedback and induction workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "slowapi>=0.1.10",
    "asyncpg>=0.31.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=49.0.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "openai>=2.53.0",
    "aioboto3>=15.5.0",
    "httpx>=0.28.1",
    "redis>=6.4.0,<6.5",
    "celery[redis]>=5.6.3",
    "croniter>=6.0.0",
    "jinja2>=3.1.6",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "pytesseract>=0.3.13",
    "Pillow>=12.3.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "spacy>=3.8.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "rapidfuzz>=3.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-mock>=3.15.1",
    "asgi-lifespan>=2.1.0",
    "respx>=0.22.0",
    "faker>=40.31.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
timeout = 120
timeout_method = "thread"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:spacy.*",
    "ignore::DeprecationWarning:presidio_analyzer.*",
    "ignore::UserWarning:presidio_analyzer.*",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
    "app/logger.py",
    "app/limiter.py",
    "app/worker/celery_app.py",
    "app/worker/tasks.py",
    "app/worker/beat.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
precision = 1
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pyright]
venvPath = "/Users/vivek/.global-venv"
venv = ".venv"
pythonVersion = "3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["archive", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/**/router.py" = ["B904"]
"app/main.py" = ["B904"]
"tests/conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]
