name: mail-reply-engine-minio

services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINIO_BASE_IMAGE: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    image: tcg-mail-reply-engine-minio:latest
    container_name: ${MINIO_CONTAINER_NAME:-mail-reply-engine-minio}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?Set MINIO_KMS_SECRET_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:2102}
    ports:
      - "${MINIO_API_BIND:-0.0.0.0}:${MINIO_API_PORT:-2103}:9000"
      - "${MINIO_CONSOLE_BIND:-0.0.0.0}:${MINIO_CONSOLE_PORT:-2104}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - minio-network
    restart: unless-stopped

  minio-init:
    image: tcg-mail-reply-engine-minio:latest
    pull_policy: never
    container_name: ${MINIO_CONTAINER_NAME:-mail-reply-engine-minio}-init
    entrypoint: ["sh", "/usr/local/bin/init-minio.sh"]
    command: []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-mail-reply-engine}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - minio-network
    restart: "no"

volumes:
  minio-data:

networks:
  minio-network:
    name: ${APP_NETWORK:-${MINIO_NETWORK:-mail-reply-engine-network}}
    driver: bridge
